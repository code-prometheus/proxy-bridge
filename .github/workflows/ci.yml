name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install cryptography
      - name: Check Python syntax
        run: |
          python -m py_compile local_proxy.py
          python -m py_compile remote_tunnel.py
          python -m py_compile tunnel_client_and_remote_proxy.py
          python -m py_compile tunnel_server_and_local_proxy.py
          python -m py_compile utils.py

  release:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package release zip
        run: |
          mkdir proxy-bridge
          cp *.py *.bat *.md proxy-bridge/
          cp -r extension proxy-bridge/
          cp -r chrome-native-config proxy-bridge/
          rm -rf proxy-bridge/__pycache__
          zip -r proxy-bridge.zip proxy-bridge/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: proxy-bridge.zip
