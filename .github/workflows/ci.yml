name: CI — Test, Tag & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # =========================================================================
  # 1. Test — runs on every push and PR
  # =========================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      # ---- 1a: Import check ----
      - name: Import check
        run: |
          python -c "
          import certs
          import connection
          import http_parser
          import nm
          import upstream
          import proxy
          print('All imports OK')
          "

      # ---- 1b: Unit tests ----
      - name: Unit tests (http_parser)
        run: |
          python tests/test_http_parser.py --verbose

      # ---- 1c: E2E proxy tests (single step — proxy must survive between tests) ----
      - name: E2E proxy tests
        run: |
          set -e

          # ——— Init CA ———
          python entry.py --init-ca
          echo "CA certificate generated"

          # Common curl options: trust our CA for MITM HTTPS
          CURL="curl -s --cacert ~/.proxy-bridge-ca/ca-cert.pem -x http://127.0.0.1:60130"
          CURL_HTTP="curl -s -x http://127.0.0.1:60130"  # plain HTTP, no CA needed

          # ——— Start proxy ———
          python entry.py &
          PROXY_PID=$!
          echo "Proxy started (PID=$PROXY_PID)"

          # ——— Wait for proxy ———
          for i in $(seq 1 20); do
            if $CURL_HTTP -o /dev/null http://httpbin.org/get 2>/dev/null; then
              echo "Proxy ready after ${i}s"
              break
            fi
            if ! kill -0 $PROXY_PID 2>/dev/null; then
              echo "FATAL: Proxy died during startup"
              exit 1
            fi
            sleep 1
          done

          # ——— Test 1: HTTP GET — basic proxy ———
          echo ""
          echo "=== Test 1: HTTP GET ==="
          RESP=$($CURL_HTTP http://httpbin.org/get)
          echo "$RESP" | python -m json.tool
          echo "$RESP" | python -c "import sys,json; d=json.load(sys.stdin); assert 'url' in d, 'Missing url field'"
          echo "PASS: HTTP GET"

          # ——— Test 2: HTTPS MITM — trust our CA, verify TLS termination ———
          echo ""
          echo "=== Test 2: HTTPS MITM ==="
          RESP=$($CURL https://httpbin.org/anything)
          echo "$RESP" | python -c "import sys,json; d=json.load(sys.stdin); assert 'url' in d, 'Missing url field'"
          echo "PASS: HTTPS MITM"

          # ——— Test 3: POST — body preservation ———
          echo ""
          echo "=== Test 3: POST ==="
          RESP=$($CURL -d '{"alpha":"test","value":42}' https://httpbin.org/post)
          echo "$RESP" | python -c "
          import sys,json
          d=json.load(sys.stdin)
          data=json.loads(d['data'])
          assert data['alpha']=='test', f'alpha mismatch: {data}'
          assert data['value']==42, f'value mismatch: {data}'
          "
          echo "PASS: POST"

          # ——— Test 4: Large response — no truncation (4096 bytes) ———
          echo ""
          echo "=== Test 4: Large response (4096 bytes) ==="
          BODY=$($CURL https://httpbin.org/bytes/4096)
          SIZE=$(echo -n "$BODY" | wc -c)
          if [ "$SIZE" -ne 4096 ]; then
            echo "FAIL: Expected 4096 bytes, got $SIZE"
            exit 1
          fi
          echo "PASS: Large response — exact 4096 bytes"

          # ——— Test 5: Regression — multi-size truncation check ———
          echo ""
          echo "=== Test 5: Regression — multi-size truncation ==="
          for s in 512 1024 2048 3072 4096 8192; do
            BODY=$($CURL "https://httpbin.org/bytes/${s}")
            actual=$(echo -n "$BODY" | wc -c)
            if [ "$actual" -ne "$s" ]; then
              echo "FAIL: ${s}B — expected ${s}, got ${actual}"
              exit 1
            fi
            echo "  ${s}B: OK"
          done
          echo "PASS: Regression — no fixed-boundary truncation"

          # ——— Test 6: Sequential requests ———
          echo ""
          echo "=== Test 6: Sequential requests ==="
          for i in 1 2 3; do
            CODE=$($CURL_HTTP -o /dev/null -w "%{http_code}" http://httpbin.org/get)
            if [ "$CODE" != "200" ]; then
              echo "FAIL: Request $i returned HTTP $CODE"
              exit 1
            fi
          done
          echo "PASS: Sequential requests — all 200"

          # ——— Test 7: HTTPS MITM JSON integrity ———
          echo ""
          echo "=== Test 7: HTTPS JSON integrity ==="
          RESP=$($CURL https://httpbin.org/json)
          echo "$RESP" | python -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'slideshow' in d, f'Missing slideshow key, got: {list(d.keys())[:10]}'
          "
          echo "PASS: HTTPS JSON — parses correctly"

          # ——— Cleanup ———
          kill $PROXY_PID 2>/dev/null || true
          wait $PROXY_PID 2>/dev/null || true
          echo ""
          echo "=== ALL E2E TESTS PASSED ==="

      # ---- 1d: Log verification ----
      - name: Verify logs (no SSL errors)
        run: |
          echo "=== super_bridge.log (last 60 lines) ==="
          tail -60 super_bridge.log || true
          echo ""
          echo "=== Checking for errors ==="
          if grep -q "No SSL wrapper" super_bridge.log 2>/dev/null; then
            echo "FAIL: 'No SSL wrapper' found in logs!"
            grep -n "No SSL wrapper" super_bridge.log
            exit 1
          fi
          if grep -q "handle_client error" super_bridge.log 2>/dev/null; then
            echo "WARNING: 'handle_client error' found in logs (non-fatal on shutdown):"
            grep -n "handle_client error" super_bridge.log
          fi
          echo "Log check passed"

  # =========================================================================
  # 2. Auto-tag — only on push to main, only if tests pass
  # =========================================================================
  auto-tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from manifest.json
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            N=1
            while git rev-parse "v${VERSION}-${N}" >/dev/null 2>&1; do
              N=$((N + 1))
            done
            TAG="v${VERSION}-${N}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag_check.outputs.tag }}" -m "Release ${{ steps.tag_check.outputs.tag }}"
          git push origin "${{ steps.tag_check.outputs.tag }}"
          echo "Pushed tag: ${{ steps.tag_check.outputs.tag }}"
