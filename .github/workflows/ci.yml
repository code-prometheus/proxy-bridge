name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install cryptography
      - name: Check Python syntax
        run: python -m py_compile *.py
      - name: Check for common issues
        run: |
          python -c "import ast, sys; [ast.parse(open(f).read()) for f in ['local_proxy.py', 'remote_tunnel.py', 'tunnel_client_and_remote_proxy.py', 'tunnel_server_and_local_proxy.py', 'utils.py']]"

  release:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.py
            *.bat
            *.md
            extension/*
            chrome-native-config/*
