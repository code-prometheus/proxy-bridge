name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm ProxyBridge-Setup.spec

      - name: Verify build output
        run: |
          dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBridge-Setup-${{ github.ref_name }}
          path: dist/ProxyBridge-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ProxyBridge-Setup-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Proxy Bridge ${{ github.ref_name }}
          body: |
            ## Proxy Bridge v3.0 — 稳定基石

            ### 核心特性
            - 模块化 v3.0 架构: proxy.py / nm.py / upstream.py / certs.py / http_parser.py / connection.py
            - Chrome Native Messaging 唯一上游转发路径
            - MITM TLS 终止 + 动态证书签发

            ### 端口 60130 生命周期
            - AutoSetup 安装前 PID 精准杀旧进程
            - proxy.py SO_EXCLUSIVEADDRUSE 防止重复绑定
            - Chrome 关闭 → NM 断开 → Python 进程退出 → 60130 释放

            ### 安装
            1. 下载 ProxyBridge-Setup.exe，右键以管理员身份运行
            2. chrome://extensions → 开发者模式 → 加载 extension/ 目录
            3. 重启 Chrome
          files: |
            dist/ProxyBridge-Setup.exe
          generate_release_notes: true
