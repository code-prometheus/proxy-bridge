name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm ProxyBridge-Setup.spec

      - name: Verify build output
        run: |
          dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBridge-Setup-${{ github.ref_name }}
          path: dist/ProxyBridge-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ProxyBridge-Setup-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Proxy Bridge ${{ github.ref_name }}
          body: |
            ## Proxy Bridge v2.1.1

            ### 🛠️ 修复
            - **NM_RESUME 死循环**: 客户端断开后 `_stream()` 返回 `sock_err`，resume loop 立即退出，不再无限重试烧 CPU
            - **响应截断 (333 字节综合征)**: `sock.shutdown(SHUT_WR)` 确保缓冲区数据完全 flush 后才关闭 TLS，防止数据丢失
            - 恢复外层 `except Exception as e:` 502 错误处理
          files: |
            dist/ProxyBridge-Setup.exe
          generate_release_notes: true
