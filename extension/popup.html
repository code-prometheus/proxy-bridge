<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Proxy Bridge</title>
  <style>
    body { width: 260px; font-family: sans-serif; padding: 15px; font-size: 14px; }
    h3 { margin: 0 0 10px 0; }
    .status { padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    .success { background: #e6f4ea; color: #137333; }
    .error { background: #fce8e6; color: #c5221f; }
    .guide { background: #f8f9fa; border: 1px solid #dadce0; padding: 10px; border-radius: 6px; font-size: 12px; }
    code { background: #eee; padding: 2px 4px; border-radius: 3px; }
    button { width: 100%; padding: 8px; margin-top: 10px; cursor: pointer; background: #1a73e8; color: white; border: none; border-radius: 4px; }
    button:hover { background: #1557b0; }
  </style>
</head>
<body>
  <h3>Proxy Bridge</h3>
  <div id="status-box" class="status">检查本地环境...</div>
  
  <div id="guide-box" class="guide" style="display:none;">
    <strong>首次使用需安装本地组件：</strong>
    <ol style="margin: 5px 0; padding-left: 20px;">
      <li>右键 <code>AutoSetup.bat</code> 选择 <strong>“以管理员身份运行”</strong></li>
      <li>按提示粘贴本扩展的 ID</li>
    </ol>
    <button id="copy-id-btn">复制我的扩展 ID</button>
  </div>

  <hr>
 <div style="font-size:12px;color:#666;">
  监听地址: <code>0.0.0.0:60130</code>
 </div>
  <script src="popup.js"></script>
</body>
</html>
