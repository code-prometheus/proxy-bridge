<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Proxy Bridge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    padding: 0;
  }

  .header {
    padding: 16px 20px 12px;
    text-align: center;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
  }
  .header .logo { font-size: 20px; margin-bottom: 2px; }
  .header h3 {
    font-size: 15px;
    font-weight: 600;
    color: #f1f5f9;
    letter-spacing: 0.3px;
  }

  .section { padding: 14px 20px; }

  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 600;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .status.online {
    background: rgba(34, 197, 94, 0.10);
    color: #86efac; border: 1px solid rgba(34, 197, 94, 0.18);
  }
  .status.online .dot { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .status.offline {
    background: rgba(239, 68, 68, 0.10);
    color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.18);
  }
  .status.offline .dot { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

  .guide {
    margin-top: 10px; padding: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(148,163,184,0.10);
    border-radius: 8px; font-size: 11px;
  }
  .guide strong { color: #f1f5f9; }
  .guide ol { margin: 8px 0 0 18px; line-height: 1.8; color: #94a3b8; }
  .guide code {
    background: rgba(255,255,255,0.08); color: #e2e8f0;
    padding: 1px 5px; border-radius: 3px; font-size: 11px;
  }

  button {
    width: 100%; padding: 9px; margin-top: 8px;
    cursor: pointer; font-size: 12px; font-weight: 600;
    border: none; border-radius: 6px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff;
    transition: opacity 0.2s, transform 0.1s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }

  .divider { height: 1px; background: rgba(148,163,184,0.10); margin: 0 20px; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0;
  }
  .toggle-row .label {
    font-size: 12px; color: #cbd5e1;
    display: flex; align-items: center; gap: 6px;
  }
  .toggle-switch {
    position: relative; width: 40px; height: 22px;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0;
    background: rgba(148,163,184,0.25);
    border-radius: 22px;
    cursor: pointer;
    transition: background 0.25s;
  }
  .toggle-slider::before {
    content: "";
    position: absolute; left: 3px; top: 3px;
    width: 16px; height: 16px;
    background: #fff; border-radius: 50%;
    transition: transform 0.25s;
  }
  .toggle-switch input:checked + .toggle-slider { background: #22c55e; }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

  .footer {
    padding: 10px 20px 14px; text-align: center;
    font-size: 11px; color: #64748b;
  }
  .footer code { color: #94a3b8; background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; }

  #save-indicator {
    font-size: 11px; color: #64748b; text-align: right;
    margin-top: 4px; min-height: 14px;
    transition: color 0.3s;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🌉</div>
  <h3>Proxy Bridge</h3>
</div>

<div class="section">
  <div id="status-box" class="status offline">
    <span class="dot"></span>
    <span id="status-text">检查本地环境...</span>
  </div>

  <div id="guide-box" class="guide" style="display:none;">
    <strong>首次使用需安装本地组件：</strong>
    <ol>
      <li>右键 <code>AutoSetup.bat</code> 选择<strong>以管理员身份运行</strong></li>
      <li>按提示粘贴本扩展的 ID</li>
    </ol>
    <button id="copy-id-btn">📋 复制我的扩展 ID</button>
  </div>
</div>

<div class="divider"></div>

<div class="section">
  <div class="toggle-row">
    <span class="label">🤝 远程服务器握手（心跳保活）</span>
    <label class="toggle-switch">
      <input type="checkbox" id="hs-checkbox">
      <span class="toggle-slider"></span>
    </label>
  </div>
  <div id="save-indicator"></div>
</div>

<div class="footer">
  监听代理 <code>127.0.0.1:60130</code>
</div>

<script src="popup.js"></script>
</body>
</html>
