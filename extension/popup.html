<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Bridge</title>
<style>
    :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --sub: #94a3b8;
        --green: #22c55e;
        --red: #ef4444;
        --blue: #3b82f6;
        --accent: #6366f1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        width: 360px;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
    }
    .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
    }
    .logo {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }
    .title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;
    }
    .version {
        font-size: 11px;
        color: var(--sub);
        font-weight: 400;
    }
    .status-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
    }
    .dot.online {
        background: var(--green);
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }
    .dot.offline {
        background: var(--red);
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }
    .status-text {
        font-size: 13px;
        font-weight: 500;
        line-height: 1.4;
    }
    .status-sub {
        font-size: 11px;
        color: var(--sub);
        margin-top: 2px;
    }
    .info-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
    }
    .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
    }
    .info-row + .info-row {
        border-top: 1px solid var(--border);
    }
    .info-label {
        font-size: 12px;
        color: var(--sub);
    }
    .info-value {
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        background: rgba(99, 102, 241, 0.15);
        color: #a5b4fc;
        padding: 3px 8px;
        border-radius: 4px;
    }
    .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 8px;
    }
    .btn-primary {
        background: var(--accent);
        color: white;
    }
    .btn-primary:hover {
        background: #4f46e5;
    }
    .btn-success {
        background: #16a34a;
        color: white;
    }
    .btn-success:hover {
        background: #15803d;
    }
    .footer {
        text-align: center;
        font-size: 11px;
        color: var(--sub);
        margin-top: 8px;
    }
</style>
</head>
<body>
    <div class="header">
        <div class="logo">🌉</div>
        <div>
            <div class="title">Proxy Bridge</div>
            <div class="version">v2.0 · Chrome Network Engine</div>
        </div>
    </div>

    <div class="status-card">
        <div class="dot" id="dot"></div>
        <div>
            <div class="status-text" id="status-text">Checking...</div>
            <div class="status-sub" id="status-sub"></div>
        </div>
    </div>

    <div class="info-card">
        <div class="info-row">
            <span class="info-label">Proxy Address</span>
            <span class="info-value">127.0.0.1:60130</span>
        </div>
        <div class="info-row">
            <span class="info-label">Extension ID</span>
            <span class="info-value" id="ext-id">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Protocol</span>
            <span class="info-value">HTTP + HTTPS</span>
        </div>
    </div>

    <button class="btn btn-primary" id="copy-id-btn">📋 Copy Extension ID</button>
    <button class="btn btn-success" id="copy-proxy-btn">🔗 Copy Proxy URL</button>

    <div class="footer">Powered by Chrome Network Stack</div>

    <script src="popup.js"></script>
</body>
</html>
